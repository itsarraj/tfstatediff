[package]
name = "tfstatediff"
version = "0.1.0"
edition = "2021"
description = "Diffs two Terraform state (.tfstate) snapshots — resources created/destroyed/drifted and output changes, with sensitive values redacted"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/tfstatediff"
readme = "README.md"
keywords = ["terraform", "state", "infrastructure", "cli", "iac"]
categories = ["command-line-utilities"]

[lib]
name = "tfstatediff"
path = "src/lib.rs"

[[bin]]
name = "tfstatediff"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
